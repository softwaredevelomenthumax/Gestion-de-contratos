name: Deploy Contract Management App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync server working copy to origin/main
        run: |
          $projectRoot = 'C:\Apps\Gestion-de-contratos'
          if (!(Test-Path $projectRoot)) { throw "Project path not found: $projectRoot" }
          cd $projectRoot
          git fetch origin
          git reset --hard origin/main
          git clean -fd

      # Codemods removed: all API calls now go through axiosInstance

      - name: Install backend dependencies
        run: |
          cd C:\Apps\Gestion-de-contratos\my-express-api
          npm ci --omit=dev

      - name: Build frontend
        run: |
          cd C:\Apps\Gestion-de-contratos\Frontend
          npm ci
          npm run build

      - name: Restart PM2 services
        run: |
          pm2 restart contract-api
          pm2 reload contract-frontend
          pm2 status | cat
