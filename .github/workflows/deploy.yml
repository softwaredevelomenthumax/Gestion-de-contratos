name: Deploy Contract Management App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Windows Server 2008 R2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        timeout: 600s
        script: |
          # Navigate to project directory
          cd "\\SVR2\Users\miguel.isaza\App"
          
          # Pull latest changes
          Write-Host "Pulling latest changes..." -ForegroundColor Green
          git pull origin main
          
          # Deploy Backend
          Write-Host "Deploying backend..." -ForegroundColor Yellow
          cd my-express-api
          npm install --production
          pm2 restart contract-api
          
          # Deploy Frontend
          Write-Host "Deploying frontend..." -ForegroundColor Yellow
          cd ../Frontend
          npm install
          npm run build
          pm2 restart contract-frontend
          
          # Show status
          Write-Host "Deployment complete!" -ForegroundColor Green
          pm2 status
