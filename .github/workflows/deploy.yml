name: Deploy Contract Management App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync server working copy to origin/main
        run: |
          $projectRoot = 'C:\Apps\Gestion-de-contratos'
          if (!(Test-Path $projectRoot)) { throw "Project path not found: $projectRoot" }
          cd $projectRoot
          git fetch origin
          git reset --hard origin/main
          git clean -fd

      - name: Apply production API URL and codemods
        env:
          API_URL: http://10.255.6.4:3001/api
        run: |
          $projectRoot = 'C:\Apps\Gestion-de-contratos'
          $files = @(
            (Join-Path $projectRoot 'Frontend\src\pages\OtrosiForm.jsx'),
            (Join-Path $projectRoot 'Frontend\src\components\Card.jsx'),
            (Join-Path $projectRoot 'Frontend\src\components\ContractFullDetail.jsx'),
            (Join-Path $projectRoot 'Frontend\src\api\profile.js'),
            (Join-Path $projectRoot 'Frontend\src\api\axiosInstance.js'),
            (Join-Path $projectRoot 'Frontend\vite.config.js')
          )
          foreach ($file in $files) {
            if (Test-Path $file) {
              (Get-Content $file -Raw) -replace 'http://localhost:3001/api', $env:API_URL |
                Set-Content $file -Encoding UTF8
            }
          }
          # Remove dev proxy target if present (not used in production)
          $vite = Join-Path $projectRoot 'Frontend\vite.config.js'
          if (Test-Path $vite) {
            $content = Get-Content $vite -Raw
            $content = $content -replace "target:\s*'http://localhost:3001',", ''
            Set-Content $vite $content -Encoding UTF8
          }

      - name: Install backend dependencies
        run: |
          cd C:\Apps\Gestion-de-contratos\my-express-api
          npm ci --omit=dev

      - name: Build frontend
        run: |
          cd C:\Apps\Gestion-de-contratos\Frontend
          npm ci
          npm run build

      - name: Restart PM2 services
        run: |
          pm2 restart contract-api
          pm2 reload contract-frontend
          pm2 status | cat
